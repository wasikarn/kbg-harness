name: validate-plugin

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: "2.1.261"

jobs:
  validate-plugin:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}

      - name: validate plugin manifest (strict)
        run: claude plugin validate --strict .

  harness-audit:
    name: harness-audit (0 CRIT)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: run harness-audit
        run: bash skills/meta/harness-audit/scripts/audit.sh .

  gauntlet:
    name: gauntlet (run-gauntlet.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}

      - name: install trash-cli
        run: sudo apt-get update && sudo apt-get install -y trash-cli

      - name: verify trash is on PATH
        run: command -v trash

      - name: run gauntlet
        run: bash scripts/run-gauntlet.sh
