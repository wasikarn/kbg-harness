name: harness-audit-drift

# Scheduled counterpart to validate.yml's push/PR-triggered harness-audit job:
# catches drift that isn't triggered by any commit (e.g. a check's own
# assumption going stale). Narrowly scoped -- this only runs harness-audit.
# gate-journal-summary.sh and feedback-surface-scan.py both read local
# developer-machine state (~/.local/share/kbg/metrics, ~/.claude/projects/.../
# memory) that doesn't exist on a CI runner, so neither is part of this job.
#
# Built as the accepted alternative to ADR 0011
# (docs/research/adr-0011-scheduled-recursive-improve-invocation.md, rejected
# 2026-08-28: a scheduled local cron/launchd cold-start of recursive-improve
# itself was judged not worth crossing the no-model-self-launch invariant
# for). This stays pure computation, no model invocation, so the invariant is
# untouched.
#
# Restored 2026-09-12 after the v1.0.0 rebuild (commit 10b6230f) swept this
# file into a bulk delete list with no per-item rationale; it had run live
# twice before that (a scheduled run and a manual dispatch). Deliberately NO
# continue-on-error here (unlike a first-landing push/PR job): this job gates
# nothing, so a red run IS the drift signal working -- continue-on-error
# would hide a broken `gh` call behind a silently-green run, and its would-be
# removal condition can never be satisfied anyway (a healthy repo makes
# audit.sh exit 0, so the gh issue branch below never executes on a "clean"
# run).

on:
  schedule:
    - cron: "0 9 * * 1" # every Monday 09:00 UTC -- adjust cadence as desired
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  harness-audit-drift:
    name: harness-audit (scheduled drift check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: run harness-audit, comment on issue #116 only if CRIT > 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          output="$(bash skills/meta/harness-audit/scripts/audit.sh . 2>&1)"
          rc=$?
          echo "$output"
          set -e
          # audit.sh's own contract is "exit code == CRIT count" -- a real run
          # always prints a "Critical: N" summary line regardless of the
          # count. If rc > 0 but that line is missing, audit.sh itself failed
          # to run (bad path, missing interpreter, a crash) rather than
          # finding CRIT problems: fail loud and distinct, don't post a
          # comment claiming "CRIT findings" for a script that never ran.
          if [ "$rc" -gt 0 ] && ! printf '%s\n' "$output" | /usr/bin/grep -q '^Critical:'; then
            echo "::error::audit.sh exited $rc without producing a normal audit report -- script/environment failure, not a CRIT finding. Not posting to issue #116." >&2
            exit "$rc"
          fi
          if [ "$rc" -gt 0 ]; then
            comment_file="${RUNNER_TEMP}/drift-comment.md"
            {
              echo "Scheduled harness-audit drift check found CRIT findings."
              echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo ""
              echo '```'
              echo "$output"
              echo '```'
              echo ""
              echo "Note: this is 1 of \`recursive-improve\`'s 3 Observe-step signals. The other"
              echo "two -- the gate-verdict journal and feedback-memory clusters -- read"
              echo "local-machine-only state this CI runner can't see (ADR:"
              echo "\`docs/research/adr-0011-scheduled-recursive-improve-invocation.md\`, rejected"
              echo "2026-08-28 -- CI can't safely pull them either). Run \`/mh:recursive-improve\`"
              echo "locally to pick those up; this comment only ever reflects harness-audit."
            } > "$comment_file"
            # Comment first, reopen second: if `gh issue reopen` ever fails for
            # any reason, the drift alert is still posted rather than lost.
            gh issue comment 116 --repo "${GITHUB_REPOSITORY}" --body-file "$comment_file"
            gh issue reopen 116 --repo "${GITHUB_REPOSITORY}" || true
            # Fail the job itself: a scheduled job gates nothing, so a red run
            # IS the drift signal -- posting a comment alone left the job
            # green even when real CRIT findings existed (deep-audit 2026-09-12).
            exit "$rc"
          fi
