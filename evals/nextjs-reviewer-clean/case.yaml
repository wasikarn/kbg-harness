schema_version: "1.1"
name: nextjs-reviewer-clean
context:
  scaffold_script: |
    cat > package.json <<'FIXTURE_EOF'
    {
      "name": "shop-web",
      "private": true,
      "dependencies": { "next": "14.2.5", "react": "18.3.1", "react-dom": "18.3.1", "stripe": "16.2.0" }
    }
    FIXTURE_EOF
    mkdir -p app
    cat > app/layout.tsx <<'FIXTURE_EOF'
    export default function RootLayout({ children }: { children: React.ReactNode }) {
      return <html lang="en"><body>{children}</body></html>;
    }
    FIXTURE_EOF
    mkdir -p app/account
    cat > app/account/page.tsx <<'FIXTURE_EOF'
    import Stripe from 'stripe';

    const stripe = new Stripe(process.env.STRIPE_SECRET_KEY!);

    export default async function AccountPage() {
      const customer = await stripe.customers.retrieve('cus_123');
      const name = 'deleted' in customer ? 'deleted customer' : customer.name ?? 'unnamed';
      return <h1>{name}</h1>;
    }
    FIXTURE_EOF
